name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Needed to upload the ShellCheck results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: make lint
        run: |
          shellcheck --version
          make lint
      # The "Protect main" ruleset waits for a ShellCheck code-scanning result
      # on every pull request, so upload one even when lint found nothing.
      # Tags have no code-scanning ref, and a fork's token cannot upload.
      - name: ShellCheck results as SARIF
        if: >-
          !cancelled() && github.ref_type != 'tag' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: make shellcheck.sarif
      - name: Upload to code scanning
        if: >-
          !cancelled() && github.ref_type != 'tag' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: shellcheck.sarif
          category: shellcheck

  smoke:
    name: Smoke test
    # tests/smoke.sh needs root and creates a test user, so it only runs on
    # a throwaway machine: a hosted runner is one.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make test
        run: make test

  ui:
    name: UI test
    # tests/ui-offscreen.py runs the real front end (ui/app.py and every
    # page in ui/qml/) off-screen. It needs PySide6 with Qt Quick, Kirigami
    # and qqc2-desktop-style; Ubuntu 24.04 packages none of them, Fedora
    # (which Bazzite is built from) has all three.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # registry.fedoraproject.org/fedora:43, by digest. Dependabot does not
      # update it: its github-actions updates cover "uses:" references to
      # GitHub repositories only (no registry URLs), and its docker updates
      # read Dockerfiles and Kubernetes manifests, not a job's container
      # image. So it is refreshed by hand. For a newer one:
      # skopeo inspect --format '{{.Digest}}' docker://registry.fedoraproject.org/fedora:43
      image: registry.fedoraproject.org/fedora@sha256:086bb30fc7dd0f84b266b9c93d14298f06e30d04421dcd6813629ea00542fa8a
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # First, so that the checkout below finds git in the container.
      - name: Install PySide6, Kirigami and make
        run: >-
          dnf install -y --setopt=install_weak_deps=False
          --disablerepo=fedora-cisco-openh264
          python3-pyside6 kf6-kirigami kf6-qqc2-desktop-style make git-core
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: make test-ui
        run: make test-ui
