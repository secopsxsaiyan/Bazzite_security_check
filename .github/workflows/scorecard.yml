# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard supply-chain security
on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: '21 11 * * 1'
  push:
    branches: [ "main" ]
  # The "Protect main" ruleset waits for a Scorecard code-scanning result on
  # every pull request.
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # `publish_results: true` only works when run from the default branch, so
    # pull requests upload to code scanning without publishing. A fork's token
    # cannot upload, so pull requests from forks are skipped.
    if: >-
      github.event.repository.default_branch == github.ref_name ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write
      # A job-level block replaces the top-level read-all, so list reads explicitly.
      contents: read
      actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) "write" PAT token. Uncomment the `repo_token` line below if:
          # - you want to enable the Branch-Protection check on a *public* repository, or
          # - you are installing Scorecard on a *private* repository
          # To create the PAT, follow the steps in https://github.com/ossf/scorecard-action?tab=readme-ov-file#authentication-with-fine-grained-pat-optional.
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

          # Public repositories:
          #   - Publish results to OpenSSF REST API for easy access by consumers
          #   - Allows the repository to include the Scorecard badge.
          #   - See https://github.com/ossf/scorecard-action#publishing-results.
          # For private repositories:
          #   - `publish_results` will always be set to `false`, regardless
          #     of the value entered here.
          publish_results: ${{ github.event_name != 'pull_request' }}

          # (Optional) Uncomment file_mode if you have a .gitattributes with files marked export-ignore
          # file_mode: git

      # On a pull request the action above only scores the checked-out files
      # (supply-chain/local). The "Protect main" ruleset also expects the two
      # repository-level result sets that main has (supply-chain/online-scm
      # and supply-chain/branch-protection), so run the same image the action
      # uses in repository mode and add those two to the results.
      - name: "Run repository-level checks (pull requests)"
        if: github.event_name == 'pull_request'
        env:
          INPUT_REPO_TOKEN: ${{ secrets.SCORECARD_TOKEN || github.token }}
          INPUT_INTERNAL_DEFAULT_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # ghcr.io/ossf/scorecard-action:v2.5.0
          SCORECARD_IMAGE: ghcr.io/ossf/scorecard-action@sha256:1e1481c65fc2407d3fd6ab18a23c741eb4d1c0d9359ebafc4b3ab13aa61d8627
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" -w /github/workspace \
            -v "$GITHUB_EVENT_PATH:/github/event.json:ro" \
            -e GITHUB_EVENT_NAME=push \
            -e GITHUB_REF="refs/heads/$DEFAULT_BRANCH" \
            -e GITHUB_EVENT_PATH=/github/event.json \
            -e GITHUB_WORKSPACE=/github/workspace \
            -e GITHUB_REPOSITORY -e GITHUB_API_URL \
            -e INPUT_REPO_TOKEN -e INPUT_INTERNAL_DEFAULT_TOKEN \
            -e INPUT_RESULTS_FILE=repo-results.sarif \
            -e INPUT_RESULTS_FORMAT=sarif \
            -e INPUT_PUBLISH_RESULTS=false \
            -e INPUT_FILE_MODE=archive \
            "$SCORECARD_IMAGE" > /dev/null
          jq -s '.[0].runs += [.[1].runs[] | select(.automationDetails.id | startswith("supply-chain/local/") | not)] | .[0]' \
            results.sarif repo-results.sarif > merged.sarif
          jq -r '.runs[].automationDetails.id' merged.sarif
          test "$(jq '.runs | length' merged.sarif)" -eq 3
          sudo mv merged.sarif results.sarif

      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard (optional).
      # Commenting out will disable upload of results to your repo's Code Scanning dashboard
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
